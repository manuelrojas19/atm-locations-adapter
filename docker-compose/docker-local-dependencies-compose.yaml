services:
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - './mongo_data:/data/db'
      - './docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d/:ro'
    environment:
      MONGO_INITDB_ROOT_USERNAME: autoil
      MONGO_INITDB_ROOT_PASSWORD: autoil33
      MONGO_INITDB_DATABASE: atm_data_db
    networks:
      - atm-adapter-network
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    environment:
      - SERVICES=secretsmanager
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "4566:4566"
    volumes:
      - "./init-local-stack/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh"
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  mongo_data:
    driver: local

networks:
  atm-adapter-network: